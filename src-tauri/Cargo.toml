[package]
name = "keevoro-app"
description = "The Keevoro desktop app: a window onto the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "keevoro_app"
path = "src/lib.rs"

[[bin]]
name = "keevoro-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
keevoro-api.workspace = true
keevoro-catalog.workspace = true
keevoro-engine.workspace = true
keevoro-update.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
image.workspace = true
keevoro-scan.workspace = true
tempfile.workspace = true
# Tauri's stand-in for a window, so the tests can drive the app's commands
# and hear its events exactly as the screens do.
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
