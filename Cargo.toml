[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.19.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
repository = "https://github.com/markcastle/keevoro"

[workspace.dependencies]
keevoro-catalog = { path = "crates/keevoro-catalog" }
keevoro-collect = { path = "crates/keevoro-collect" }
keevoro-core = { path = "crates/keevoro-core" }
keevoro-engine = { path = "crates/keevoro-engine" }
keevoro-frame = { path = "crates/keevoro-frame" }
keevoro-index = { path = "crates/keevoro-index" }
keevoro-media = { path = "crates/keevoro-media" }
keevoro-publish = { path = "crates/keevoro-publish" }
keevoro-scan = { path = "crates/keevoro-scan" }
keevoro-storage = { path = "crates/keevoro-storage" }
keevoro-storage-folder = { path = "crates/keevoro-storage-folder" }
keevoro-storage-s3 = { path = "crates/keevoro-storage-s3" }
keevoro-update = { path = "crates/keevoro-update" }

anyhow = "1"
async-trait = "0.1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
blake3 = "1"
blurhash = { version = "0.2", default-features = false }
clap = { version = "4", features = ["derive"] }
fs4 = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
imagesize = "0.14"
infer = "0.19"
kamadak-exif = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
regex = "1"
schemars = "1"
rpassword = "7"
rusqlite = { version = "0.43", features = ["bundled"] }
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
ureq = { version = "3", features = ["platform-verifier"] }
walkdir = "2"
webp = { version = "0.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Image decoding and hashing are painfully slow unoptimised, and the tests
# do a lot of both. Our own code stays quick to compile and debug.
[profile.dev.package."*"]
opt-level = 2
# Debug data for dependencies is rarely looked at and, with the desktop
# app's dependencies, runs to many gigabytes of build output.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
