name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The installers are not Rust, so they get their own checks: the
      # shell one is linted and the PowerShell one must at least parse.
      - run: shellcheck install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The S3 adapter is only really tested against a real S3-compatible
      # server. MinIO runs here so those tests count towards coverage.
      # These are throwaway credentials for a server that lives for one job.
      # The video tests make and convert real videos, and skip themselves
      # where ffmpeg is missing. Installing it here is what makes them count.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start MinIO (local S3-compatible server)
        run: |
          # MinIO's own image is no longer on Docker Hub, so try the places
          # it can still be had, in order, and use the first that starts.
          for image in \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z \
            ghcr.io/coollabsio/minio:latest \
            cgr.dev/chainguard/minio:latest; do
            if docker run -d --name minio -p 9000:9000 \
              -e MINIO_ROOT_USER=keevoro -e MINIO_ROOT_PASSWORD=keevoro-test-secret \
              "$image" server /data; then
              echo "Using $image"
              break
            fi
            docker rm -f minio >/dev/null 2>&1 || true
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          AWS_ACCESS_KEY_ID=keevoro AWS_SECRET_ACCESS_KEY=keevoro-test-secret AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://keevoro-test
      - name: Coverage (fails under 90% of lines)
        env:
          KEEVORO_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          KEEVORO_S3_TEST_BUCKET: keevoro-test
          KEEVORO_S3_TEST_ACCESS_KEY: keevoro
          KEEVORO_S3_TEST_SECRET_KEY: keevoro-test-secret
          KEEVORO_ACCESS_KEY_ID: keevoro
          KEEVORO_SECRET_ACCESS_KEY: keevoro-test-secret
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 90 --summary-only
