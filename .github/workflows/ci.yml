name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also test and build for macOS. Off day to day; on before a milestone.'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app is built on Tauri, which on Linux needs these.
      - name: Install the libraries the desktop app needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      # The app's screens are compiled into the app, so they are built first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: npm run lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The installers are not Rust, so they get their own checks: the
      # shell one is linted and the PowerShell one must at least parse.
      - run: shellcheck install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where Keevoro is used and tried day to day, so it is
        # the one tested on every change. Linux is covered by the coverage
        # job, which runs the same tests. macOS runners are slow to come by
        # and held changes up for hours, so they are saved for milestones:
        # run this workflow by hand with "all platforms" ticked.
        os: ${{ fromJSON(inputs.all_platforms && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the libraries the desktop app needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      # The app's screens are compiled into the app, so they are built first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: cargo test --workspace

  # Opens the app's screens in a real browser and uses them like a person,
  # against the stand-in backend. See scripts/ui-test.mjs.
  ui:
    name: screens (browser test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      # The system packages are fonts and libraries the runner mostly has
      # already; when its package mirror is unreachable the browser alone
      # is enough to run the test.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run ui:test
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ui/tests/screens
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The S3 adapter is only really tested against a real S3-compatible
      # server. MinIO runs here so those tests count towards coverage.
      # These are throwaway credentials for a server that lives for one job.
      # The video tests make and convert real videos, and skip themselves
      # where ffmpeg is missing. Installing it here is what makes them count.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start MinIO (local S3-compatible server)
        run: |
          # MinIO's own image is no longer on Docker Hub, so try the places
          # it can still be had, in order, and use the first that starts.
          for image in \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z \
            ghcr.io/coollabsio/minio:latest \
            cgr.dev/chainguard/minio:latest; do
            if docker run -d --name minio -p 9000:9000 \
              -e MINIO_ROOT_USER=keevoro -e MINIO_ROOT_PASSWORD=keevoro-test-secret \
              "$image" server /data; then
              echo "Using $image"
              break
            fi
            docker rm -f minio >/dev/null 2>&1 || true
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          AWS_ACCESS_KEY_ID=keevoro AWS_SECRET_ACCESS_KEY=keevoro-test-secret AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://keevoro-test
      - name: Coverage (fails under 90% of lines)
        env:
          KEEVORO_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          KEEVORO_S3_TEST_BUCKET: keevoro-test
          KEEVORO_S3_TEST_ACCESS_KEY: keevoro
          KEEVORO_S3_TEST_SECRET_KEY: keevoro-test-secret
          KEEVORO_ACCESS_KEY_ID: keevoro
          KEEVORO_SECRET_ACCESS_KEY: keevoro-test-secret
        # The desktop shell (src-tauri) is left out: it is a thin layer over
        # the engine that only runs inside a window, so its lines cannot be
        # exercised here. Its own small tests still run in the test job.
        run: cargo llvm-cov --workspace --exclude keevoro-app --all-features --fail-under-lines 90 --summary-only

  # Builds the real installers. Not on pull requests, where it would add a
  # quarter of an hour to every change; on main and on demand, so there is
  # always a current installer to download from the run's page and try.
  installers:
    name: installer (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # macOS only when asked for; see the note on the test job.
        include: ${{ fromJSON(inputs.all_platforms && '[{"name":"Windows x64","os":"windows-latest","args":""},{"name":"macOS universal","os":"macos-latest","args":"--target universal-apple-darwin"}]' || '[{"name":"Windows x64","os":"windows-latest","args":""}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/build-installer.sh ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keevoro installer (${{ matrix.name }})
          path: installers/*
          retention-days: 14
